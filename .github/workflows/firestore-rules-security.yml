name: Firestore Rules Security

on:
  workflow_dispatch:
  push:
    branches:
      - feature/transversal-action-plans

permissions:
  contents: read

jobs:
  rules:
    name: Emulator Rules suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-stratexa-rules

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Print reproducibility metadata
        run: |
          node --version
          npm --version
          java -version
          npx firebase --version
          echo "commit=${GITHUB_SHA}"
          echo "firebase_project=${FIREBASE_PROJECT_ID}"

      - name: Run Firestore Rules tests in isolated emulator
        run: npx firebase emulators:exec --only firestore --project "$FIREBASE_PROJECT_ID" "npx jest firestore.rules.test.ts --runInBand --testPathIgnorePatterns="
