name: Firebase Hosting keyless preview

on:
  workflow_dispatch:

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate with Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: prior-01
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_HOSTING_CI_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase Hosting preview
        run: |
          npx firebase-tools hosting:channel:deploy "keyless-${GITHUB_RUN_ID}" \
            --only tablero \
            --project prior-01 \
            --expires 1d
